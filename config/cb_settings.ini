; ChickenBench v1.0.8 settings
; Lines starting with ; are comments. Edit the value after the = sign.

; ---- Paths ----
CS2Dir=C:\Program Files (x86)\Steam\steamapps\common\Counter-Strike Global Offensive
SteamExe=C:\Program Files (x86)\Steam\steam.exe

; ---- Benchmark map (Angel's CS2 FPS BENCHMARK DUST2) ----
WorkshopId=3240880604
MapName=de_dust2

; ---- Command key ----
; In-game, the runner writes commands to cfg\cb_cmd.cfg and presses this key, which is
; bound to "exec cb_cmd" (set automatically). Tested working: PGDN (Page Down).
; Allowed: PGDN PGUP INS DEL HOME END F9 F10 F11 F12. Pick one you never use.
BindKey=PGDN

; ---- PresentMon ----
; Leave PresentMonExe empty to use the newest PresentMon*.exe in the tools folder.
PresentMonExe=
; {out} = output CSV, {secs} = capture length. Only change if your PresentMon version rejects a flag.
PresentMonArgs=--process_name cs2.exe --output_file "{out}" --timed {secs} --terminate_after_timed --stop_existing_session --no_console_stats

; ---- Sweeps ----
; Chicken levels must be multiples of 50 (one config\cs2_cfg\cb_sNN.cfg stage per 50). Max 1000.
; Chickens accumulate within a pass (always run low -> high); cleared at the start of each pass.
ChickenLevels=0,50,100,150,200,250,300,350,400,450,500
; Timescale levels (1 = normal speed, keep it as the baseline).
TimescaleLevels=1,2,4,8,12
Passes=3

; ---- Lap timing, in GAME seconds after the round starts (divided by the timescale automatically) ----
; Angel's flythrough runs from about 7.0 s to 117.9 s; the script disconnects at about 124 s.
CaptureStart=9
CaptureEnd=113
RestartAt=114
; Chicken sweep: each lap spawns its 50 new chickens right after its restart, during Angel's
; ~7 s countdown, and keeps counting until they all exist. They must be confirmed by
; SpawnConfirmBy (game seconds after the round start; the capture starts at CaptureStart),
; otherwise the lap is flagged spawn_unconfirmed.
SpawnConfirmBy=7
; Remove all chickens at the start of each pass (ent_fire chicken kill + ent_remove_all chicken).
; 1 = on (default). 0 = never sent; passes after the first reload the map instead.
ClearChickensAtPassStart=1
; A lap is flagged if its chicken count is off by more than this many percent.
ChickenTolerancePct=10

; ---- Close CS2 when the run is done (1 = yes, 0 = no) ----
QuitWhenDone=1
